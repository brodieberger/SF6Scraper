<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/scripts.js"></script>
    <title>Street Fighter Profile Scraper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-3">
        <h1>Street Fighter Profile Scraper</h1>
        <h5>Created by Stingrays110</h5>
        <h5>Welcome {{username}}, you have played {{matchcount}} matches</h5>

        <div class="row">
            <!-- Chart.js Line Chart -->
            <div class="col-xl-12 col-xxl-6" style="text-align: center;">
                <h5>Average MR over 100 matches: {{avgmr_100}}</h5>
                <h5>Average MR over 10 matches: {{avgmr_10}}</h5>
                <canvas id="mrLineChart"></canvas>
            </div>
        </div>
    </div>
</body>

</html>
